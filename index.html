<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MotoLink</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font-family:system-ui;background:#111;color:#fff;overflow:hidden}.top{position:absolute;z-index:1000;top:12px;left:12px;right:12px;display:flex;gap:8px}.search{flex:1;border:0;border-radius:14px;padding:13px;font-size:16px}.btn,.nav button{border:0;background:#111d;color:#fff}.btn{border-radius:14px;padding:0 16px;font-size:22px}.status{position:absolute;z-index:1000;top:68px;left:12px;background:#111d;padding:7px 10px;border-radius:10px;font-size:12px}.card{position:absolute;z-index:1000;left:12px;right:12px;bottom:78px;background:#111e;padding:14px;border-radius:18px;backdrop-filter:blur(10px)}.row{display:flex;justify-content:space-between}.small{opacity:.7;font-size:12px}.big{font-size:24px;font-weight:700}.route{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-weight:700}.nav{position:absolute;z-index:1000;bottom:10px;left:12px;right:12px;height:58px;border-radius:18px;background:#111e;display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(10px)}.nav button{font-size:11px;display:flex;flex-direction:column;align-items:center}.nav b{font-size:21px}</style></head><body><div id="map"></div><div class="top"><input id="search" class="search" placeholder="Search destination…"><button id="go" class="btn">⌕</button></div><div id="status" class="status">Locating…</div><div class="card"><div class="row"><div><div class="small">GPS SPEED</div><div id="speed" class="big">0 km/h</div></div><div style="text-align:right"><div class="small">GPS</div><div id="gps">Waiting</div></div></div><div id="dest" class="small" style="margin-top:8px">No destination selected</div><button id="route" class="route">START NAVIGATION</button></div><div class="nav"><button id="mapBtn"><b>⌖</b>Map</button><button id="navBtn"><b>➤</b>Navigate</button><button id="favBtn"><b>★</b>Favorite</button><button id="setBtn"><b>⚙</b>Settings</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const $=id=>document.getElementById(id);const map=L.map('map',{zoomControl:false}).setView([20.5937,78.9629],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);L.control.zoom({position:'right'}).addTo(map);let pos=null,user,dest,route;function gps(){if(!navigator.geolocation){$('status').textContent='GPS not supported';return}navigator.geolocation.getCurrentPosition(p=>{setPos(p);map.setView(pos,16)},e=>$('status').textContent='GPS unavailable',{enableHighAccuracy:true,timeout:10000});navigator.geolocation.watchPosition(setPos,()=>{}, {enableHighAccuracy:true,maximumAge:2000})}function setPos(p){pos=[p.coords.latitude,p.coords.longitude];if(!user)user=L.marker(pos).addTo(map).bindPopup('You are here');else user.setLatLng(pos);$('speed').textContent=Math.round((p.coords.speed||0)*3.6)+' km/h';$('gps').textContent='Connected';$('status').textContent='GPS connected';if(dest)draw()}function draw(){if(route)route.remove();route=L.polyline([pos,dest],{weight:6,opacity:.8}).addTo(map)}async function search(){let q=$('search').value.trim();if(!q)return;$('status').textContent='Searching…';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));let a=await r.json();if(!a.length){$('status').textContent='Not found';return}dest=[+a[0].lat,+a[0].lon];if(window.dm)dm.remove();window.dm=L.marker(dest).addTo(map).bindPopup(a[0].display_name).openPopup();$('dest').textContent=a[0].display_name;draw();map.fitBounds(L.latLngBounds(pos?[pos,dest]:[dest]),{padding:[50,50]});$('status').textContent='Destination selected'}catch(e){$('status').textContent='Search failed'}}$('go').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};$('route').onclick=()=>dest?alert('MotoLink navigation started. This prototype is ready for the next routing/hardware integration.'):alert('Search a destination first.');$('mapBtn').onclick=()=>pos&&map.setView(pos,16);$('navBtn').onclick=()=>$('search').focus();$('favBtn').onclick=()=>dest?(localStorage.motolink=JSON.stringify(dest),alert('Favorite saved')):alert('Select a destination first.');$('setBtn').onclick=()=>alert('MotoLink Prototype\nGPS: Device GPS\nMap: OpenStreetMap');gps();</script></body></html>
